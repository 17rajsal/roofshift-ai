AWSTemplateFormatVersion: '2010-09-09'
Description: 'RoofShift AI Cloud Infrastructure Stack — Production-Ready AWS Architecture'

Parameters:
  InstanceType:
    Type: String
    Default: 't3.small'
    AllowedValues:
      - 't3.micro'
      - 't3.small'
      - 't3.medium'
    Description: 'EC2 instance type for RoofShift AI web and solver services'

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'
    Description: 'Latest Amazon Linux 2023 AMI'

  RepositoryUrl:
    Type: String
    AllowedPattern: '^https://[A-Za-z0-9._/-]+$'
    Description: 'HTTPS Git repository URL accessible without credentials from the instance'

  RepositoryRef:
    Type: String
    Default: 'master'
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
    Description: 'Reviewed branch or tag to deploy; set this to the integrated application ref'

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: RoofShift-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: RoofShift-IGW

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - Key: Name
          Value: RoofShift-PublicSubnet

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: RoofShift-RouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  RoofShiftSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Allow HTTP access through the RoofShift AI frontend proxy'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  RoofShiftAppServer:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - SubnetRouteTableAssociation
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      MetadataOptions:
        HttpTokens: required
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref RoofShiftSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: RoofShift-AI-Server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/roofshift-bootstrap.log) 2>&1
          # Enable 2GB swap space for t3.micro memory safety during Docker build
          dd if=/dev/zero of=/swapfile bs=128M count=16
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /usr/local/bin /usr/libexec/docker/cli-plugins
          curl -fSL --retry 5 https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          cp /usr/local/lib/docker/cli-plugins/docker-compose /usr/libexec/docker/cli-plugins/docker-compose
          ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose
          ln -sf /usr/local/lib/docker/cli-plugins/docker-compose /usr/bin/docker-compose
          git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/roofshift-ai
          cd /opt/roofshift-ai
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/v1/health >/dev/null 2>&1; then
              echo "RoofShift AI is healthy and operational!"
              exit 0
            fi
            sleep 5
          done
          echo "Healthcheck timeout after 300s"
          exit 1

Outputs:
  PublicIP:
    Description: 'Public IP address of the RoofShift AI server'
    Value: !GetAtt RoofShiftAppServer.PublicIp
  AppURL:
    Description: 'URL of the RoofShift AI Web Application'
    Value: !Sub 'http://${RoofShiftAppServer.PublicIp}'
  ApiHealthURL:
    Description: 'Backend health through the frontend proxy'
    Value: !Sub 'http://${RoofShiftAppServer.PublicIp}/api/v1/health'
