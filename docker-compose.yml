services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roofshift_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/roofshift.db
      - REPORTS_DIR=/app/generated_reports
      - UPLOADS_DIR=/data/uploaded_demand
      - NASA_POWER_BASE_URL=https://power.larc.nasa.gov/api/temporal/climatology/point
    volumes:
      - backend_data:/data
      - reports_data:/app/generated_reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roofshift_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  reports_data:
