name: RoofShift AI CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - antigravity/core-app
      - integration/master-delivery
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Pytest Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest test suite
        run: |
          python -m pytest -o pythonpath=backend backend/tests -v

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile TypeScript & Vite build
        run: |
          cd frontend
          npm run build
